<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contacto de Tienda Esotérica. Escribinos por el formulario y te respondemos por email.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&family=EB+Garamond:ital,wght@0,400..800;1,400..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
    <title>Contacto | Tienda Esotérica</title>
</head>
<body>
    <header>
         <div class="div-logo">
            <a href="../index.html" aria-label="Volver al inicio">
                <img src="../img/logo.PNG" alt="Logo de Tienda Esotérica" class="logo">
            </a>
        </div>
 
 
        <nav class="header-nav">
            <ul>
                <li><a href="../index.html">Home</a></li>
                <li><a href="./contacto.html">Contacto</a></li>
                <li><a href="./carrito.html">Carrito<span id="contador-carrito"> (0)</span></a></li>

            </ul>

        </nav>
    </header>

    <main>
        <h1 class="titulo-contacto text-secondary">Contactanos</h1>

        <!-- novalidate: apagamos la validación nativa para mostrar nuestros propios mensajes de error -->
        <form class="form-contacto" action="https://formspree.io/f/mojrgqqp" method="POST" novalidate>
            <div class="grupo-input">
                <label for="email">Email:</label>
                <input id="email" type="email" name="email" autocomplete="email" required>
            </div>
            <div class="grupo-input">
                <label for="mensaje">Mensaje:</label>
                <textarea id="mensaje" name="message" rows="4" required minlength="10"></textarea>
            </div>
            <p id="error-formulario" class="mensaje-error" role="alert"></p>
            <button class="btn bg-secondary text-dark" type="submit">Enviar</button>
        </form>
    </main> 

    <footer>
        <p>Sitio realizado por Leonardo De Filippis y Juan Del Castillo para la materia Programación Frontend - IPAP - 2026</p>
        <nav>
            <ul class="footer-list">
                <li><img src="../img/ws.png" alt="logo-whatsapp"/></li>
                <li><img src="../img/instagram.png" alt="logo-instagram"/></li>
            </ul>
        </nav>
    </footer> 
    <script type="module" src="../js/contacto.js"></script>
</body>
</html>
